name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: unzip TengcdTool.zip -d project_source

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

    # 核心修复 1：强制将 Gradle 下载地址替换为官方稳定的 downloads 域名
    - name: Inject Gradle Mirror
      run: |
        find project_source -name "gradle-wrapper.properties" -exec sed -i 's|services.gradle.org/distributions|downloads.gradle.org/distributions|g' {} +
        echo "Gradle 官方稳定源注入完成！"

    # 核心修复 2：保留阿里云 Maven 镜像（解决依赖下载问题）
    - name: Inject Aliyun Maven Mirrors
      run: |
        find project_source -name "settings.gradle*" -exec sed -i 's/google()/maven("https:\/\/maven.aliyun.com\/repository\/google")/g' {} +
        find project_source -name "settings.gradle*" -exec sed -i 's/mavenCentral()/maven("https:\/\/maven.aliyun.com\/repository\/public")/g' {} +
        find project_source -name "build.gradle*" -exec sed -i 's/google()/maven("https:\/\/maven.aliyun.com\/repository\/google")/g' {} +
        find project_source -name "build.gradle*" -exec sed -i 's/mavenCentral()/maven("https:\/\/maven.aliyun.com\/repository\/public")/g' {} +

    - name: Grant execute permission and Build
      run: |
        GRADLE_DIR=$(find project_source -name gradlew -exec dirname {} \; | head -n 1)
        chmod +x "$GRADLE_DIR/gradlew"
        cd "$GRADLE_DIR"
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project_source/**/app/build/outputs/apk/debug/app-debug.apk
