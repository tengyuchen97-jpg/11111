name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: unzip TengcdTool.zip -d project_source

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

    # 【新增：核心修复】强行注入阿里云镜像，解决云端下载依赖超时问题
    - name: Inject Aliyun Maven Mirrors
      run: |
        echo "正在替换官方仓库为阿里云镜像..."
        # 1. 处理 settings.gradle 和 settings.gradle.kts
        find project_source -name "settings.gradle*" -exec sed -i 's/google()/maven("https:\/\/maven.aliyun.com\/repository\/google")/g' {} +
        find project_source -name "settings.gradle*" -exec sed -i 's/mavenCentral()/maven("https:\/\/maven.aliyun.com\/repository\/public")/g' {} +
        find project_source -name "settings.gradle*" -exec sed -i 's/gradlePluginPortal()/maven("https:\/\/maven.aliyun.com\/repository\/gradle-plugin")\n        gradlePluginPortal()/g' {} +
        # 处理 Groovy 语法的 settings.gradle
        find project_source -name "settings.gradle" -exec sed -i 's/google()/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }/g' {} +
        find project_source -name "settings.gradle" -exec sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/g' {} +
        
        # 2. 处理根目录和 module 的 build.gradle 和 build.gradle.kts
        find project_source -name "build.gradle*" -exec sed -i 's/google()/maven("https:\/\/maven.aliyun.com\/repository\/google")/g' {} +
        find project_source -name "build.gradle*" -exec sed -i 's/mavenCentral()/maven("https:\/\/maven.aliyun.com\/repository\/public")/g' {} +
        find project_source -name "build.gradle" -exec sed -i 's/google()/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }/g' {} +
        find project_source -name "build.gradle" -exec sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/g' {} +
        echo "镜像注入完成！"

    - name: Grant execute permission and Build
      run: |
        GRADLE_DIR=$(find project_source -name gradlew -exec dirname {} \; | head -n 1)
        echo "找到 gradlew 的目录为: $GRADLE_DIR"
        chmod +x "$GRADLE_DIR/gradlew"
        cd "$GRADLE_DIR"
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project_source/**/app/build/outputs/apk/debug/app-debug.apk
