name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: unzip TengcdTool.zip -d project_source

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

    - name: Inject Aliyun Maven Mirrors
      run: |
        find project_source -name "settings.gradle*" -exec sed -i 's/google()/maven { url "https:\/\/maven.aliyun.com\/repository\/google" }\n        maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/g' {} +
        find project_source -name "settings.gradle*" -exec sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/public" }/g' {} +

    # ================= 魔法：无中生有，补全缺失的组件 =================
    - name: Fix Missing Components
      run: |
        DIR_PATH=$(find project_source -type d -path "*/com/tengcd/czr/ui/components" | head -n 1)
        mkdir -p "$DIR_PATH"
        
        echo "1. 正在生成缺失的 LiquidGlassDialog.kt..."
        echo "" | base64 -d > "$DIR_PATH/LiquidGlassDialog.kt"

        echo "2. 正在生成缺失的 DownloadProgressDialog.kt..."
        echo " " | base64 -d > "$DIR_PATH/DownloadProgressDialog.kt"
        
        echo "组件补齐完成！"

    - name: Grant execute permission and Build
      run: |
        GRADLE_DIR=$(find project_source -name gradlew -exec dirname {} \; | head -n 1)
        echo "找到 gradlew 的目录为: $GRADLE_DIR"
        chmod +x "$GRADLE_DIR/gradlew"
        cd "$GRADLE_DIR"
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project_source/**/app/build/outputs/apk/debug/app-debug.apk
