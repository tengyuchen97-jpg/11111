name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: unzip TengcdTool.zip -d project_source

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK
      run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

    - name: Add Xposed Repository
      run: |
        echo "开始注入 Xposed 仓库地址..."
        # 自动寻找所有的 gradle 文件，并在 repositories 块内插入仓库地址
        find project_source -name "*.gradle" -type f -exec sed -i '/repositories {/a \        maven { url "https://api.xposed.info/" }' {} +
        echo "注入完成，检查结果："
        find project_source -name "*.gradle" -exec grep -H "xposed.info" {} +

    - name: Grant execute permission and Build
      run: |
        # 自动寻找 gradlew 所在的真实目录
        GRADLE_DIR=$(find project_source -name gradlew -exec dirname {} \; | head -n 1)
        echo "找到 gradlew 的目录为: $GRADLE_DIR"
        # 给执行权限
        chmod +x "$GRADLE_DIR/gradlew"
        # 进入该目录并开始打包
        cd "$GRADLE_DIR"
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # 使用通配符 ** 自动寻找生成的 APK
        path: project_source/**/app/build/outputs/apk/debug/app-debug.apk
